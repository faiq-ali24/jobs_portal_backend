default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: jobs_portal_development
  username: faiqa
  host: /var/run/postgresql

test:
  <<: *default
  database: jobs_portal_test
  username: faiqa
  host: /var/run/postgresql

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>